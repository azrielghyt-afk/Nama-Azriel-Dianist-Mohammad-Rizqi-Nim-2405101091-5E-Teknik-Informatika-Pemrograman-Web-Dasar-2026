<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Perpustakaan Kota Madiun</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef3f8; }
        form { max-width: 460px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; }
        h2 { text-align: center; }
        .baris { margin-bottom: 14px; }
        .baris > label:first-child { display: block; font-weight: bold; margin-bottom: 4px; }
        input[type="text"], input[type="email"], input[type="password"], input[type="date"], select, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
        input[type="submit"] { width: 100%; padding: 10px; background: #1b7f5c; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<form action="Formulir_Perpuskotamadiun.html" method="post">
    <h2>Pendaftaran Anggota<br>Perpustakaan Kota Madiun</h2>

    <div class="baris">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama">
    </div>

    <div class="baris">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
    </div>

    <div class="baris">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
    </div>

    <div class="baris">
        <label>Jenis Kelamin</label>
        <input type="radio" id="lk" name="jenis_kelamin" value="laki-laki" checked>
        <label for="lk">Laki-Laki</label>
        <input type="radio" id="pr" name="jenis_kelamin" value="perempuan">
        <label for="pr">Perempuan</label>
    </div>

    <div class="baris">
        <label for="tgl">Tanggal Lahir</label>
        <input type="date" id="tgl" name="tanggal_lahir">
    </div>

    <div class="baris">
        <label for="pekerjaan">Pekerjaan</label>
        <select id="pekerjaan" name="pekerjaan">
            <option value="pelajar">Pelajar</option>
            <option value="mahasiswa">Mahasiswa</option>
            <option value="pegawai">Pegawai</option>
            <option value="lainnya">Lainnya</option>
        </select>
    </div>

    <div class="baris">
        <label>Minat Bacaan</label>
        <input type="checkbox" id="novel" name="minat[]" value="novel">
        <label for="novel">Novel</label><br>
        <input type="checkbox" id="pelajaran" name="minat[]" value="pelajaran">
        <label for="pelajaran">Buku Pelajaran</label><br>
        <input type="checkbox" id="sejarah" name="minat[]" value="sejarah">
        <label for="sejarah">Sejarah</label>
    </div>

    <div class="baris">
        <label for="alamat">Alamat</label>
        <textarea id="alamat" name="alamat" rows="4"></textarea>
    </div>

    <input type="submit" value="Daftar">
</form>
</body>
</html>
