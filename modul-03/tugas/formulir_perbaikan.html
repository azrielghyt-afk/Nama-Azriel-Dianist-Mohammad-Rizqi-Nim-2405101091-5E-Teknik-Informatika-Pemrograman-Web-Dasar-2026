<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Membuat Form</title>
</head>
<body>
<form action="formulir_perbaikan.html" method="get">
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama" value="Nama Kamu">
    <br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br>
    Jenis Kelamin:
    <input type="radio" id="lk" name="jenis_kelamin" value="laki-laki" checked>
    <label for="lk">Laki-Laki</label>
    <input type="radio" id="pr" name="jenis_kelamin" value="perempuan">
    <label for="pr">Perempuan</label>
    <br>
    Hobi:
    <input type="checkbox" id="baca" name="hobi[]" value="membaca">
    <label for="baca">Membaca Buku</label>
    <input type="checkbox" id="nulis" name="hobi[]" value="menulis" checked>
    <label for="nulis">Menulis</label>
    <input type="checkbox" id="mancing" name="hobi[]" value="memancing">
    <label for="mancing">Memancing</label>
    <br>
    <label for="kota">Asal Kota:</label>
    <select id="kota" name="asal_kota">
        <option value="Kota Jakarta">Jakarta</option>
        <option value="Kota Bandung">Bandung</option>
        <option value="Kota Semarang" selected>Semarang</option>
    </select>
    <br>
    <label for="komentar">Komentar Anda:</label>
    <br>
    <textarea id="komentar" name="komentar" rows="5" cols="20">Silahkan katakan isi hati anda</textarea>
    <br>
    <input type="submit" value="Mulai Proses!">
</form>
</body>
</html>
